name: Production deploy

on:
  workflow_dispatch:
    inputs:
      enable_read:
        description: Enable accepted-memory reads
        required: true
        type: boolean
        default: false
      enable_mcp:
        description: Enable the OAuth-protected MCP adapter
        required: true
        type: boolean
        default: false
      enable_actions:
        description: Enable OAuth-protected Actions routes
        required: true
        type: boolean
        default: false
      enable_propose:
        description: Enable candidate proposal intake
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mnemosyne-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MNEMOSYNE_D1_DATABASE_ID: ${{ secrets.MNEMOSYNE_D1_DATABASE_ID }}
      GRAPH_MEMORY_READ_ENABLED: ${{ inputs.enable_read && '1' || '0' }}
      GRAPH_MEMORY_MCP_ENABLED: ${{ inputs.enable_mcp && '1' || '0' }}
      GRAPH_MEMORY_ACTIONS_ENABLED: ${{ inputs.enable_actions && '1' || '0' }}
      GRAPH_MEMORY_PROPOSE_ENABLED: ${{ inputs.enable_propose && '1' || '0' }}
      GRAPH_MEMORY_REVIEW_ENABLED: "0"
      GRAPH_MEMORY_PUBLICATION_ENABLED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify complete Worker
        run: npm test
      - name: Ensure dedicated OAuth KV binding
        run: node scripts/ensure-oauth-kv.mjs
      - name: Build binding-preserving ephemeral configuration
        shell: bash
        run: |
          npx wrangler deployments list --json > /tmp/deployments.json
          VERSION_ID="$(node scripts/cloudflare-binding-preflight.mjs version-id /tmp/deployments.json)"
          npx wrangler versions view "$VERSION_ID" --json > /tmp/version.json
          node scripts/cloudflare-binding-preflight.mjs build-config /tmp/version.json /tmp/wrangler.production.json
      - name: Apply forward-only graph-memory migration
        run: npx wrangler d1 migrations apply DB --remote --config /tmp/wrangler.production.json
      - name: Deploy with existing bindings preserved
        shell: bash
        run: |
          if ! npx wrangler deploy --keep-vars --config /tmp/wrangler.production.json > /tmp/deploy.log 2>&1; then
            sed -E 's#https?://[^ ]+#<redacted-url>#g; s/[0-9a-f]{32,}/<redacted-id>/g' /tmp/deploy.log
            exit 1
          fi
          echo "Worker deployment completed; identifiers withheld."
