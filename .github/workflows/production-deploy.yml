name: Production deploy

on:
  workflow_dispatch:
    inputs:
      enable_read:
        description: Enable accepted-memory reads
        required: true
        type: boolean
        default: false
      enable_mcp:
        description: Enable the OAuth-protected MCP adapter
        required: true
        type: boolean
        default: false
      enable_actions:
        description: Enable OAuth-protected Actions routes
        required: true
        type: boolean
        default: false
      enable_propose:
        description: Enable candidate proposal intake
        required: true
        type: boolean
        default: false
      enable_validation:
        description: Enable owner-authenticated candidate validation
        required: true
        type: boolean
        default: false
      enable_resolution:
        description: Enable owner-authenticated candidate entity resolution
        required: true
        type: boolean
        default: false
      enable_owner_review:
        description: Enable owner-authenticated review receipts
        required: true
        type: boolean
        default: false
      enable_owner_commit:
        description: Enable owner-controlled canonical commit
        required: true
        type: boolean
        default: false
      enable_custom_domain:
        description: Attach memory.azzayezz.com after the retired Tunnel route is removed
        required: true
        type: boolean
        default: false
      projection_command:
        description: Optional exact reviewed visual projection operation
        required: true
        type: choice
        options:
          - skip
          - plan
          - upsert
          - verify
          - remove-version
        default: skip

permissions:
  contents: read

concurrency:
  group: mnemosyne-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MNEMOSYNE_D1_DATABASE_ID: ${{ secrets.MNEMOSYNE_D1_DATABASE_ID }}
      OAUTH_KV_NAMESPACE_ID: ${{ secrets.OAUTH_KV_NAMESPACE_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GRANT_RESOLVER_TOKEN: ${{ secrets.GRANT_RESOLVER_TOKEN }}
      OPENAI_APPS_CHALLENGE: ${{ secrets.OPENAI_APPS_CHALLENGE }}
      LEGACY_CREDENTIAL_PEPPER: ${{ secrets.LEGACY_CREDENTIAL_PEPPER }}
      AUTHORIZED_GITHUB_USER_IDS: "277895262"
      MEMORY_TENANT_ID: "personal"
      SPECIALIST_PACKAGE_VERSION: "2026-08-03.2"
      SPECIALIST_DEFAULT_PROJECT_IDS: "project-infinitum"
      SPECIALIST_REQUIRED_IDS: "ariadne,haava,hearken,nadeem,savae,synn,vitruvius"
      MNEMOSYNE_CUSTOM_DOMAIN: ${{ inputs.enable_custom_domain && 'memory.azzayezz.com' || '' }}
      GRAPH_MEMORY_READ_ENABLED: ${{ inputs.enable_read && '1' || '0' }}
      GRAPH_MEMORY_MCP_ENABLED: ${{ inputs.enable_mcp && '1' || '0' }}
      GRAPH_MEMORY_ACTIONS_ENABLED: ${{ inputs.enable_actions && '1' || '0' }}
      GRAPH_MEMORY_PROPOSE_ENABLED: ${{ inputs.enable_propose && '1' || '0' }}
      GRAPH_MEMORY_VALIDATION_ENABLED: ${{ inputs.enable_validation && '1' || '0' }}
      GRAPH_MEMORY_RESOLUTION_ENABLED: ${{ inputs.enable_resolution && '1' || '0' }}
      GRAPH_MEMORY_OWNER_REVIEW_ENABLED: ${{ inputs.enable_owner_review && '1' || '0' }}
      GRAPH_MEMORY_OWNER_COMMIT_ENABLED: ${{ inputs.enable_owner_commit && '1' || '0' }}
      GRAPH_MEMORY_REVIEW_ENABLED: "0"
      GRAPH_MEMORY_PUBLICATION_ENABLED: "0"
      VISUAL_SKILL_MANIFEST: artifacts/visual-skills/2026-08-04.1/projection-manifest.json
      VISUAL_SKILL_CATALOG_VERSION: 2026-08-04.1
      VISUAL_SKILL_INSTALLED_HASH: f7f1069e200d4f22e03dd8de219dfbec897817da18bebc2a6a44c908f484e5ea
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify complete Worker
        run: npm test
      - name: Ensure dedicated OAuth KV binding
        shell: bash
        run: |
          if [[ -n "$OAUTH_KV_NAMESPACE_ID" ]]; then
            echo "::add-mask::$OAUTH_KV_NAMESPACE_ID"
            exit 0
          fi
          if node scripts/ensure-oauth-kv.mjs; then
            exit 0
          fi
          if [[ "$GRAPH_MEMORY_MCP_ENABLED" == "1" || "$GRAPH_MEMORY_ACTIONS_ENABLED" == "1" || "$GRAPH_MEMORY_VALIDATION_ENABLED" == "1" || "$GRAPH_MEMORY_RESOLUTION_ENABLED" == "1" || "$GRAPH_MEMORY_OWNER_REVIEW_ENABLED" == "1" || "$GRAPH_MEMORY_OWNER_COMMIT_ENABLED" == "1" ]]; then
            echo "OAuth KV is required before enabling public adapters."
            exit 1
          fi
          echo "OAuth KV unavailable to this token; continuing only because all public adapters are disabled."
      - name: Verify private activation inputs
        shell: bash
        run: |
          if [[ -z "$LEGACY_CREDENTIAL_PEPPER" ]]; then
            echo "Required credential migration input is missing."
            exit 1
          fi
          if [[ "$GRAPH_MEMORY_MCP_ENABLED" == "1" || "$GRAPH_MEMORY_ACTIONS_ENABLED" == "1" || "$GRAPH_MEMORY_VALIDATION_ENABLED" == "1" || "$GRAPH_MEMORY_RESOLUTION_ENABLED" == "1" || "$GRAPH_MEMORY_OWNER_REVIEW_ENABLED" == "1" || "$GRAPH_MEMORY_OWNER_COMMIT_ENABLED" == "1" ]]; then
            for name in OAUTH_KV_NAMESPACE_ID GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GRANT_RESOLVER_TOKEN; do
              if [[ -z "${!name}" ]]; then
                echo "Required private activation input is missing: $name"
                exit 1
              fi
            done
          fi
      - name: Build binding-preserving ephemeral configuration
        shell: bash
        run: |
          npx wrangler deployments list --json > /tmp/deployments.json
          VERSION_ID="$(node scripts/cloudflare-binding-preflight.mjs version-id /tmp/deployments.json)"
          npx wrangler versions view "$VERSION_ID" --json > /tmp/version.json
          node scripts/cloudflare-binding-preflight.mjs build-config /tmp/version.json /tmp/wrangler.production.json
      - name: Install private Worker secrets
        shell: bash
        run: |
          put_secret() {
            local name="$1"
            local value="${!name}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" |
                npx wrangler secret put "$name" --config /tmp/wrangler.production.json >/dev/null
            fi
          }
          put_secret GITHUB_CLIENT_ID
          put_secret GITHUB_CLIENT_SECRET
          put_secret GRANT_RESOLVER_TOKEN
          put_secret OPENAI_APPS_CHALLENGE
          put_secret LEGACY_CREDENTIAL_PEPPER
      - name: Apply forward-only graph-memory migration
        run: npx wrangler d1 migrations apply DB --remote --config /tmp/wrangler.production.json
      - name: Migrate registered specialist credentials to HMAC D1
        shell: bash
        run: |
          node scripts/migrate-live-specialist-credentials.mjs \
            --version-file /tmp/version.json \
            --output /tmp/specialist-credentials.sql
          npx wrangler d1 execute DB --remote \
            --config /tmp/wrangler.production.json \
            --file /tmp/specialist-credentials.sql >/dev/null
          echo "Registered specialist credentials migrated as HMAC hashes."
      - name: Ensure bounded visual skill metadata indexes
        shell: bash
        run: |
          ensure_metadata_index() {
            local property="$1"
            local create_output
            npx wrangler vectorize list-metadata-index mnemosyne-skills --json > /tmp/vectorize-metadata.json
            if jq -e --arg property "$property" \
              '.. | objects | select((.propertyName? // .property_name? // .name?) == $property and .type? == "string")' \
              /tmp/vectorize-metadata.json >/dev/null; then
              return 0
            fi
            if create_output="$(npx wrangler vectorize create-metadata-index mnemosyne-skills \
              --propertyName "$property" --type string 2>&1)"; then
              return 0
            fi
            if grep -q 'code: 40004' <<<"$create_output"; then
              return 0
            fi
            echo "Metadata index creation failed for a required property."
            return 1
          }
          ensure_metadata_index tenant_id
          ensure_metadata_index project_id
          ensure_metadata_index domain_id
          ensure_metadata_index consumer_id
      - name: Execute optional bounded visual projection operation
        if: inputs.projection_command != 'skip'
        shell: bash
        run: |
          VISUAL_ADMIN_KEY="$(node --input-type=module -e 'import {deriveVisualSkillAdminKey} from "./src/oauth.js"; process.stdout.write(await deriveVisualSkillAdminKey(process.env.GRANT_RESOLVER_TOKEN));')"
          echo "::add-mask::$VISUAL_ADMIN_KEY"
          APPLY=()
          case "${{ inputs.projection_command }}" in
            upsert|remove-version) APPLY=(--apply) ;;
            plan|verify) ;;
            *) exit 2 ;;
          esac
          MATRIX_AUTH_KEY="$VISUAL_ADMIN_KEY" MNEMOSYNE_ADMIN_URL="https://memory.azzayezz.com" \
            node scripts/manage-visual-skill-projection.mjs \
            "${{ inputs.projection_command }}" \
            --manifest "$VISUAL_SKILL_MANIFEST" \
            --expected-catalog-version "$VISUAL_SKILL_CATALOG_VERSION" \
            --expected-installed-skill-hash "$VISUAL_SKILL_INSTALLED_HASH" \
            --environment production \
            "${APPLY[@]}"
      - name: Deploy with existing bindings preserved
        shell: bash
        run: |
          if ! npx wrangler deploy --keep-vars --config /tmp/wrangler.production.json > /tmp/deploy.log 2>&1; then
            sed -E 's#https?://[^ ]+#<redacted-url>#g; s/[0-9a-f]{32,}/<redacted-id>/g' /tmp/deploy.log
            exit 1
          fi
          echo "Worker deployment completed; identifiers withheld."
